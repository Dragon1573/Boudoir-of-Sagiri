name: 'CodeQL Check'

on:
  push:
    branches:
      - butterfly
      - dependabot/**
  pull_request:
    branches:
      - butterfly
  schedule:
    - cron: '0 0 * * 1'

env:
  # Use HK SAR., China would be better
  TZ: 'Asia/HongKong'

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # We need to build the project, full logs is required
          - depth: 0
            language: javascript-typescript
          # Only latest commit is required
          - depth: 1
            language: actions

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ matrix.depth }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: '/language:${{ matrix.language }}'
